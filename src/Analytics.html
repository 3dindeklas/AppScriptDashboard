<script>
/* Pure functions shared by the UI and the Node regression suite. */
const Analytics = (() => {
  const sum = (rows, key) => rows.reduce((n, r) => n + (r[key] ?? 0), 0);
  function schoolYear(day) {
    if (!day) return 'Onbekend';
    const y = +day.slice(0, 4) - (+day.slice(5, 7) < 8 ? 1 : 0);
    return y + '–' + (y + 1);
  }
  function months(rows, field) {
    const dates = rows.map(r => r[field]).filter(Boolean).sort();
    if (!dates.length) return [];
    let y = +dates[0].slice(0, 4), m = +dates[0].slice(5, 7);
    const last = dates[dates.length - 1].slice(0, 7), result = [];
    while (true) {
      const value = y + '-' + String(m).padStart(2, '0'); result.push(value);
      if (value === last) break;
      if (++m === 13) { m = 1; y++; }
    }
    return result;
  }
  function filter(rows, f) {
    return rows.filter(r => {
      for (const key of ['source', 'region', 'provider', 'workshop', 'sector', 'statusGroup', 'type', 'school']) {
        if (f[key] && r[key] !== f[key]) return false;
      }
      const day = r[f.dateField || 'requested'];
      if (f.schoolYear && schoolYear(day) !== f.schoolYear) return false;
      if (!day) { if (!f.includeUndated) return false; }
      else if ((f.from && day.slice(0, 7) < f.from) || (f.to && day.slice(0, 7) > f.to)) return false;
      if (r.students === null) { if (!f.includeUnknownStudents) return false; }
      else if (r.students < f.minStudents || r.students > f.maxStudents) return false;
      return true;
    });
  }
  function group(rows, key, metric = 'requests') {
    const map = new Map();
    rows.forEach(r => { const k = r[key]; map.set(k, (map.get(k) || 0) + (metric === 'requests' ? 1 : (r[metric] ?? 0))); });
    return [...map].map(([label, value]) => ({ label, value })).sort((a, b) => b.value - a.value || a.label.localeCompare(b.label, 'nl'));
  }
  function summary(rows) {
    const schools = new Set(rows.map(r => r.schoolKey).filter(Boolean)).size;
    const knownStudents = rows.filter(r => r.students !== null);
    const financed = rows.filter(r => r.revenue !== null && r.costs !== null);
    const comparableRevenue = sum(financed, 'revenue'), comparableCosts = sum(financed, 'costs');
    const delays = rows.filter(r => r.requested && r.scheduled && r.scheduled >= r.requested)
      .map(r => (Date.parse(r.scheduled) - Date.parse(r.requested)) / 86400000);
    return { requests: rows.length, students: sum(rows, 'students'), schools,
      sessions: sum(rows, 'sessions'), executed: rows.filter(r => r.statusGroup === 'Uitgevoerd').length,
      avgPerSchool: schools ? rows.filter(r => r.schoolKey).length / schools : null,
      avgStudents: knownStudents.length ? sum(knownStudents, 'students') / knownStudents.length : null,
      unknownStudents: rows.length - knownStudents.length,
      revenue: sum(rows, 'revenue'), costs: sum(rows, 'costs'), margin: comparableRevenue - comparableCosts,
      marginPct: comparableRevenue ? (comparableRevenue - comparableCosts) / comparableRevenue * 100 : null,
      financeComplete: financed.length, unknownSessions: rows.filter(r => r.sessions === null).length,
      delay: delays.length ? delays.reduce((a, b) => a + b, 0) / delays.length : null,
      delayCount: delays.length };
  }
  function grades(rows, sector) {
    const selected = rows.filter(r => r.sector === sector), map = new Map();
    let unknown = 0;
    selected.forEach(r => {
      if (!r.grades.length) { unknown++; return; }
      r.grades.forEach(g => map.set(String(g), (map.get(String(g)) || 0) + 1 / r.grades.length));
    });
    const result = [...map].sort((a, b) => +a[0] - +b[0]).map(([label, value]) => ({ label: 'Leerjaar ' + label, value }));
    if (unknown) result.push({ label: 'Onbekend', value: unknown });
    return result;
  }
  return { sum, schoolYear, months, filter, group, summary, grades };
})();
</script>
