<style>
  :root {
    --ink: #183b37;
    --muted: #667a76;
    --teal: #167c6a;
    --teal-dark: #0f5f51;
    --lime: #d5ee91;
    --paper: #f4f6f2;
    --line: #dce4dd;
    --white: #ffffff;
    --warning: #8a451f;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--paper);
  }

  * { box-sizing: border-box; }
  body { margin: 0; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  button, select, input { font: inherit; }
  button, select, input { cursor: pointer; }
  h1, h2, p { margin: 0; }
  h1 { font-size: clamp(2.3rem, 5vw, 4.5rem); line-height: 1; letter-spacing: -0.055em; }
  h2 { font-size: 1.1rem; letter-spacing: -0.02em; }
  h3 { margin: 0; font-size: 0.95rem; }

  button:focus-visible,
  select:focus-visible,
  input:focus-visible,
  summary:focus-visible,
  a:focus-visible {
    outline: 3px solid #c36d1c;
    outline-offset: 3px;
  }

  .skip-link {
    position: absolute;
    left: 1rem;
    top: -5rem;
    z-index: 10;
    padding: 0.75rem 1rem;
    background: var(--white);
    color: var(--ink);
  }
  .skip-link:focus { top: 1rem; }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1.25rem max(1.25rem, 4vw);
    border-bottom: 1px solid var(--line);
    background: var(--white);
  }

  .brand { display: flex; align-items: center; gap: 0.75rem; font-size: 1.25rem; font-weight: 750; }
  .brand strong { color: var(--teal); }
  .brand-mark {
    display: grid;
    place-items: center;
    width: 2.65rem;
    height: 2.65rem;
    border-radius: 0.8rem;
    background: var(--teal);
    color: var(--white);
    font-size: 1.8rem;
    line-height: 1;
  }

  .button {
    border: 1px solid var(--line);
    border-radius: 0.65rem;
    padding: 0.7rem 1rem;
    background: var(--white);
    color: var(--ink);
    font-weight: 650;
  }
  .button:hover { background: var(--paper); }
  .button:disabled { cursor: wait; opacity: 0.55; }

  .page { width: min(78rem, 100%); margin: 0 auto; padding: 3rem max(1.25rem, 4vw) 2rem; }
  .intro { display: flex; align-items: end; justify-content: space-between; gap: 2rem; margin-bottom: 2rem; }
  .intro > div:first-child > p:last-child { margin-top: 1rem; color: var(--muted); }
  .eyebrow { margin-bottom: 0.55rem; color: var(--teal); font-size: 0.68rem; font-weight: 800; letter-spacing: 0.16em; }
  .load-meta { display: grid; justify-items: end; gap: 0.55rem; color: var(--muted); font-size: 0.76rem; }
  .badge { padding: 0.4rem 0.7rem; border-radius: 99rem; background: #e3eee8; color: var(--teal-dark); font-weight: 750; }

  .message { margin-bottom: 1rem; padding: 0.9rem 1rem; border: 1px solid #cddab0; border-radius: 0.75rem; background: #edf3e1; font-size: 0.9rem; }
  .message.loading { display: flex; align-items: center; gap: 0.7rem; }
  .message.loading::before { content: ""; flex: 0 0 auto; width: 1rem; height: 1rem; border: 0.16rem solid #b8d8cf; border-top-color: var(--teal); border-radius: 50%; animation: spin 700ms linear infinite; }
  .message.error { border-color: #e0b89f; background: #fff0e7; color: var(--warning); }
  .message.warning { border-color: #e2cf9a; background: #fff8df; color: #6e5311; }
  .message[hidden] { display: none; }

  .panel { margin-bottom: 1rem; padding: 1.4rem; border: 1px solid var(--line); border-radius: 1rem; background: var(--white); }
  .panel-heading { display: flex; align-items: start; justify-content: space-between; gap: 1rem; margin-bottom: 1.35rem; }
  .text-button { border: 0; padding: 0.4rem; background: transparent; color: var(--teal); font-weight: 700; }

  .source-summary { color: var(--muted); font-size: 0.76rem; text-align: right; }
  .source-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.8rem; }
  .source-card { padding: 1rem; border: 1px solid var(--line); border-left: 0.3rem solid var(--teal); border-radius: 0.75rem; background: #fafbf8; }
  .source-card.source-warning { border-left-color: #c28a19; }
  .source-card.source-error, .source-card.source-not-configured { border-left-color: #b75b35; }
  .source-card-heading { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .source-badge { padding: 0.25rem 0.55rem; border-radius: 99rem; background: #e3eee8; color: var(--teal-dark); font-size: 0.68rem; font-weight: 750; }
  .source-warning .source-badge { background: #fff0c5; color: #75530d; }
  .source-error .source-badge, .source-not-configured .source-badge { background: #ffeadf; color: var(--warning); }
  .source-count, .source-message, .source-error-meta { margin-top: 0.55rem; color: var(--muted); font-size: 0.76rem; }
  .source-error-meta { color: var(--warning); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
  .source-warnings { display: grid; gap: 0.25rem; margin: 0.7rem 0 0; padding-left: 1.1rem; color: #6e5311; font-size: 0.72rem; }

  .filter-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
  label { color: var(--muted); font-size: 0.75rem; font-weight: 700; }
  select { width: 100%; margin-top: 0.45rem; padding: 0.75rem 2rem 0.75rem 0.75rem; border: 1px solid var(--line); border-radius: 0.6rem; background: #fafbf8; color: var(--ink); }
  .range-filter-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; margin-top: 1.35rem; }
  .range-card { min-width: 0; margin: 0; padding: 1rem; border: 1px solid var(--line); border-radius: 0.75rem; background: #fafbf8; }
  .range-card legend { padding: 0 0.35rem; color: var(--ink); font-size: 0.82rem; font-weight: 750; }
  .control-label { display: block; margin-bottom: 1rem; }
  .range-row + .range-row { margin-top: 0.85rem; }
  .range-row label { display: flex; justify-content: space-between; gap: 1rem; }
  .range-value { color: var(--ink); font-weight: 750; font-variant-numeric: tabular-nums; text-align: right; }
  input[type="range"] { width: 100%; margin: 0.55rem 0 0; accent-color: var(--teal); }
  input[type="range"]:disabled { cursor: not-allowed; opacity: 0.5; }
  .check-label { display: flex; align-items: start; gap: 0.55rem; margin-top: 1rem; line-height: 1.4; }
  .check-label input { flex: 0 0 auto; width: 1rem; height: 1rem; margin: 0.1rem 0 0; accent-color: var(--teal); }
  .result-count { margin-top: 1rem; color: var(--muted); font-size: 0.78rem; }

  .metrics-section { margin-bottom: 1rem; }
  .metrics-heading { margin: 1.5rem 0 1rem; }
  .kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1rem; }
  .kpi { min-height: 8.5rem; padding: 1.35rem; border: 1px solid var(--line); border-radius: 1rem; background: var(--white); }
  .kpi:first-child { border-color: var(--ink); background: var(--ink); color: var(--white); }
  .kpi-label { color: var(--muted); font-size: 0.75rem; }
  .kpi:first-child .kpi-label { color: #bfd2ca; }
  .kpi-value { margin-top: 0.65rem; font-size: 2.35rem; font-weight: 750; font-variant-numeric: tabular-nums; }
  .kpi-quality { margin-top: 0.75rem; color: var(--muted); font-size: 0.76rem; }

  .comparison-summary { color: var(--muted); font-size: 0.76rem; text-align: right; }
  .comparison-table { min-width: 64rem; }
  .comparison-table th:not(:first-child), .comparison-table td:not(:first-child) { text-align: right; }
  .comparison-table tbody th { background: transparent; color: var(--ink); font-size: 0.82rem; }

  .financial-panel { overflow: hidden; padding: 0; }
  .financial-panel[hidden] { display: none; }
  .financial-panel > summary { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1.35rem 1.4rem; cursor: pointer; list-style: none; }
  .financial-panel > summary::-webkit-details-marker { display: none; }
  .financial-panel > summary::after { content: "⌄"; color: var(--teal); font-size: 1.25rem; font-weight: 800; transition: transform 180ms ease; }
  .financial-panel[open] > summary::after { transform: rotate(180deg); }
  .financial-panel .eyebrow { display: block; }
  .financial-title { display: block; font-size: 1.1rem; font-weight: 750; letter-spacing: -0.02em; }
  .financial-toggle { margin-left: auto; color: var(--teal); font-size: 0.74rem; font-weight: 750; }
  .financial-toggle-close { display: none; }
  .financial-panel[open] .financial-toggle-open { display: none; }
  .financial-panel[open] .financial-toggle-close { display: inline; }
  .financial-content { padding: 0 1.4rem 1.4rem; border-top: 1px solid var(--line); }
  .financial-intro { max-width: 54rem; margin: 1.2rem 0; color: var(--muted); font-size: 0.78rem; line-height: 1.55; }
  .financial-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.85rem; }
  .financial-kpi { min-width: 0; padding: 1rem; border: 1px solid var(--line); border-radius: 0.75rem; background: #fafbf8; }
  .financial-kpi-label { color: var(--muted); font-size: 0.72rem; line-height: 1.35; }
  .financial-kpi-value { margin-top: 0.45rem; overflow-wrap: anywhere; font-size: 1.45rem; font-weight: 750; font-variant-numeric: tabular-nums; }
  .financial-completeness { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.85rem; margin-top: 0.85rem; }
  .financial-quality { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; padding: 0.8rem 1rem; border-radius: 0.7rem; background: #edf3e1; }
  .financial-quality.incomplete { background: #fff8df; }
  .financial-quality-label { color: var(--muted); font-size: 0.74rem; }
  .financial-quality-value { font-size: 1.1rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .financial-note { margin-top: 0.85rem; color: var(--muted); font-size: 0.74rem; line-height: 1.5; }

  .analytics-section { margin: 2rem 0 1rem; }
  .analytics-heading { display: flex; align-items: end; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
  .analytics-heading > p { color: var(--muted); font-size: 0.76rem; text-align: right; }
  .chart-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
  .chart-card { display: flex; min-width: 0; flex-direction: column; }
  .chart-card .panel-heading { margin-bottom: 1rem; }
  .chart-subtitle { margin-top: 0.45rem; color: var(--muted); font-size: 0.76rem; line-height: 1.45; }
  .metric-select { width: min(14rem, 100%); }
  .metric-select select { min-width: 12rem; }
  .bar-chart { display: grid; gap: 0.9rem; min-height: 8rem; }
  .bar-row { display: grid; gap: 0.38rem; }
  .bar-label { display: flex; justify-content: space-between; gap: 1rem; font-size: 0.78rem; }
  .bar-label span { overflow-wrap: anywhere; }
  .bar-track { height: 0.55rem; overflow: hidden; border-radius: 99rem; background: #edf1eb; }
  .bar-fill { height: 100%; border-radius: inherit; background: var(--teal); transform-origin: left; animation: grow 320ms ease-out both; }
  .chart-legend { display: flex; flex-wrap: wrap; gap: 0.55rem 1rem; min-height: 1.4rem; margin-bottom: 1rem; color: var(--muted); font-size: 0.74rem; }
  .legend-item { display: inline-flex; align-items: center; gap: 0.4rem; }
  .legend-swatch { width: 0.65rem; height: 0.65rem; border-radius: 0.2rem; }
  .timeline-chart { min-height: 16rem; overflow-x: auto; padding: 0.5rem 0 0.25rem; }
  .timeline-columns { display: flex; align-items: stretch; gap: 0.65rem; height: 15rem; min-width: max(100%, var(--timeline-width, 36rem)); }
  .timeline-column { display: grid; flex: 1 0 3.25rem; grid-template-rows: 1.4rem 1fr 2.25rem; gap: 0.35rem; min-width: 3.25rem; text-align: center; }
  .timeline-total { align-self: end; font-size: 0.7rem; font-weight: 750; font-variant-numeric: tabular-nums; }
  .timeline-track { display: flex; align-self: end; flex-direction: column-reverse; width: min(2.25rem, 80%); min-height: 0.25rem; margin: 0 auto; overflow: hidden; border-radius: 0.4rem 0.4rem 0 0; background: #edf1eb; transform-origin: bottom; animation: grow-up 320ms ease-out both; }
  .timeline-segment { width: 100%; min-height: 0; }
  .timeline-label { color: var(--muted); font-size: 0.65rem; line-height: 1.2; }
  .chart-data { margin-top: 1rem; border-top: 1px solid var(--line); padding-top: 0.8rem; }
  .chart-data summary { cursor: pointer; color: var(--teal); font-size: 0.74rem; font-weight: 750; }
  .chart-data[open] summary { margin-bottom: 0.65rem; }
  .chart-table { min-width: 22rem; }
  .chart-table th:not(:first-child), .chart-table td:not(:first-child) { text-align: right; }
  .chart-note { margin: 0.25rem 0 1.5rem; color: var(--muted); font-size: 0.76rem; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  th, td { padding: 0.85rem 0.75rem; border-bottom: 1px solid #edf0ea; text-align: left; white-space: nowrap; }
  th { background: #f7f8f5; color: var(--muted); font-size: 0.7rem; }
  th:last-child, td:last-child { text-align: right; }
  .empty { padding: 2rem 0.5rem; color: var(--muted); text-align: center; }

  footer { display: flex; justify-content: space-between; gap: 1rem; padding-top: 1rem; color: var(--muted); font-size: 0.72rem; }

  @keyframes grow { from { transform: scaleX(0); } }
  @keyframes grow-up { from { transform: scaleY(0); } }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 950px) {
    .filter-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .financial-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .chart-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  @media (max-width: 700px) {
    .page { padding-top: 2rem; }
    .intro { align-items: start; }
    .load-meta { justify-items: start; }
    .intro, footer { flex-direction: column; }
    .filter-grid, .range-filter-grid, .kpi-grid, .financial-grid, .financial-completeness, .chart-grid, .source-grid { grid-template-columns: 1fr; }
    .financial-panel > summary { align-items: start; }
    .financial-toggle { display: none; }
    .analytics-heading, .timeline-panel .panel-heading { align-items: start; flex-direction: column; }
    .analytics-heading > p, .source-summary, .comparison-summary { text-align: left; }
    .metric-select { width: 100%; }
    .metric-select select { min-width: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
</style>
