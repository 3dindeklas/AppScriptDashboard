<script>
  (() => {
    'use strict';

    const state = {
      records: [],
      sources: [],
      mode: 'demo',
      generatedAt: '',
      complete: true,
      canViewFinancials: false,
      dateMonths: [],
      studentBounds: null,
      loadStartedAt: 0,
      loadingTimers: []
    };
    const numberFormat = new Intl.NumberFormat('nl-NL');
    const decimalFormat = new Intl.NumberFormat('nl-NL', {
      minimumFractionDigits: 1,
      maximumFractionDigits: 1
    });
    const currencyFormat = new Intl.NumberFormat('nl-NL', {
      style: 'currency',
      currency: 'EUR',
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
    const percentFormat = new Intl.NumberFormat('nl-NL', {
      style: 'percent',
      minimumFractionDigits: 1,
      maximumFractionDigits: 1
    });
    const chartNumberFormat = new Intl.NumberFormat('nl-NL', {
      maximumFractionDigits: 2
    });
    const timelineMetrics = {
      requests: { label: 'Aanvragen / workshops' },
      students: { label: 'Leerlingdeelnames' },
      sessions: { label: 'Lesmomenten' }
    };
    const timelinePalette = ['#167c6a', '#9693cf', '#dca25e', '#83a8ba', '#b4c77b', '#c77f90'];
    const sourceStatusLabels = {
      demo: 'Demo',
      ok: 'Geladen',
      warning: 'Aandachtspunt',
      error: 'Niet geladen',
      'not-configured': 'Niet ingesteld'
    };
    const warningLabels = {
      rowsTruncated: 'Rijen boven de ingestelde limiet',
      emptyRows: 'Lege rijen',
      missingRequestIds: 'Ontbrekende aanvraag-ID’s',
      duplicateRequestIds: 'Dubbele aanvraag-ID’s',
      invalidRequestedDates: 'Ongeldige aanvraagdatums',
      invalidScheduledDates: 'Ongeldige definitieve datums',
      invalidStudentCounts: 'Ongeldige leerlingaantallen',
      unknownSectors: 'Onbekende onderwijssectoren'
    };
    const elements = {
      dashboard: document.getElementById('dashboard'),
      refresh: document.getElementById('refreshButton'),
      reset: document.getElementById('resetButton'),
      message: document.getElementById('message'),
      mode: document.getElementById('modeBadge'),
      updated: document.getElementById('updatedAt'),
      sourceSummary: document.getElementById('sourceSummary'),
      sourceCards: document.getElementById('sourceCards'),
      dateBasis: document.getElementById('dateBasis'),
      dateFrom: document.getElementById('dateFromRange'),
      dateTo: document.getElementById('dateToRange'),
      dateFromValue: document.getElementById('dateFromValue'),
      dateToValue: document.getElementById('dateToValue'),
      includeUnknownDate: document.getElementById('includeUnknownDate'),
      studentsFrom: document.getElementById('studentsFromRange'),
      studentsTo: document.getElementById('studentsToRange'),
      studentsFromValue: document.getElementById('studentsFromValue'),
      studentsToValue: document.getElementById('studentsToValue'),
      includeUnknownStudents: document.getElementById('includeUnknownStudents'),
      resultCount: document.getElementById('resultCount'),
      kpis: document.getElementById('kpis'),
      kpiQualityNote: document.getElementById('kpiQualityNote'),
      comparisonSummary: document.getElementById('comparisonSummary'),
      comparisonRows: document.getElementById('comparisonRows'),
      financialOverview: document.getElementById('financialOverview'),
      financialKpis: document.getElementById('financialKpis'),
      financialCompleteness: document.getElementById('financialCompleteness'),
      financialNote: document.getElementById('financialNote'),
      timelineMetric: document.getElementById('timelineMetric'),
      timelineSubtitle: document.getElementById('timelineSubtitle'),
      timelineLegend: document.getElementById('timelineLegend'),
      timelineChart: document.getElementById('timelineChart'),
      timelineCaption: document.getElementById('timelineCaption'),
      timelineTableHead: document.getElementById('timelineTableHead'),
      timelineTableRows: document.getElementById('timelineTableRows'),
      sectorChart: document.getElementById('sectorChart'),
      sectorTableRows: document.getElementById('sectorTableRows'),
      regionChart: document.getElementById('regionChart'),
      regionTableRows: document.getElementById('regionTableRows'),
      statusChart: document.getElementById('statusChart'),
      statusTableRows: document.getElementById('statusTableRows'),
      workshopChart: document.getElementById('workshopChart'),
      workshopTableRows: document.getElementById('workshopTableRows'),
      providerChart: document.getElementById('providerChart'),
      providerTableRows: document.getElementById('providerTableRows'),
      poChart: document.getElementById('poChart'),
      poTableRows: document.getElementById('poTableRows'),
      voChart: document.getElementById('voChart'),
      voTableRows: document.getElementById('voTableRows'),
      recentRows: document.getElementById('recentRows'),
      recentDateHeading: document.getElementById('recentDateHeading')
    };
    const filters = [
      ['source', document.getElementById('sourceFilter')],
      ['schoolYear', document.getElementById('schoolYearFilter')],
      ['region', document.getElementById('regionFilter')],
      ['sector', document.getElementById('sectorFilter')],
      ['provider', document.getElementById('providerFilter')],
      ['workshop', document.getElementById('workshopFilter')],
      ['statusGroup', document.getElementById('statusGroupFilter')],
      ['school', document.getElementById('schoolFilter')],
      ['type', document.getElementById('typeFilter')]
    ].map(filter => ({ field: filter[0], element: filter[1] }));

    function loadDashboard() {
      beginLoadingFeedback();

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(handleData)
          .withFailureHandler(handleError)
          .getDashboardData();
        return;
      }

      if (window.__DEMO_PAYLOAD__) {
        handleData(window.__DEMO_PAYLOAD__);
        return;
      }

      handleError(new Error('De Apps Script-verbinding is niet beschikbaar.'));
    }

    function handleData(payload) {
      if (!payload || !Array.isArray(payload.records)) {
        handleError(new Error('De server gaf geen geldige dashboardgegevens terug.'));
        return;
      }

      const loadDuration = stopLoadingFeedback();

      state.records = payload.records;
      state.sources = Array.isArray(payload.sources) ? payload.sources : [];
      state.mode = payload.mode || 'live';
      state.generatedAt = payload.generatedAt || new Date().toISOString();
      state.complete = payload.complete !== false;
      state.canViewFinancials = Boolean(
        payload.permissions && payload.permissions.canViewFinancials === true
      );
      elements.financialOverview.hidden = !state.canViewFinancials;
      if (!state.canViewFinancials) elements.financialOverview.open = false;
      if (!timelineMetrics[elements.timelineMetric.value]) elements.timelineMetric.value = 'requests';

      filters.forEach(filter => fillFilter(filter.element, valuesOf(filter.field)));
      configureDateRange(true);
      configureStudentRange(true);

      elements.mode.textContent = state.mode === 'demo' ? 'Demogegevens' : 'Live gegevens';
      elements.updated.textContent = 'Bijgewerkt ' + formatDateTime(state.generatedAt) +
        ' · geladen in ' + formatLoadDuration(loadDuration);
      renderSourceStatus();
      renderLoadMessage();
      render();
    }

    function handleError(error) {
      stopLoadingFeedback();
      elements.message.hidden = false;
      elements.message.classList.remove('warning');
      elements.message.classList.add('error');
      const detail = error && error.message ? error.message.replace(/^Error:\s*/, '') : 'Onbekende fout.';
      elements.message.textContent = 'Dashboard kon niet laden. ' + detail;
      elements.mode.textContent = 'Niet geladen';
    }

    function renderLoadMessage() {
      const hasWarnings = state.sources.some(source => source.warningCount > 0);
      elements.message.classList.remove('error', 'warning', 'loading');

      if (!state.complete) {
        elements.message.hidden = false;
        elements.message.classList.add('warning');
        elements.message.textContent = state.records.length
          ? 'Het overzicht is onvolledig. De beschikbare bronnen worden wel getoond.'
          : 'Er zijn geen live gegevens geladen. Controleer de bronstatus hieronder.';
        return;
      }

      if (hasWarnings) {
        elements.message.hidden = false;
        elements.message.classList.add('warning');
        elements.message.textContent = 'De gegevens zijn geladen met datakwaliteitswaarschuwingen.';
        return;
      }

      elements.message.hidden = true;
    }

    function renderSourceStatus() {
      elements.sourceCards.replaceChildren();
      const loaded = state.sources.filter(source => ['demo', 'ok', 'warning'].includes(source.status)).length;
      elements.sourceSummary.textContent = loaded + ' van ' + state.sources.length + ' bronnen beschikbaar';

      if (!state.sources.length) {
        elements.sourceCards.appendChild(emptyMessage('Er zijn geen bronnen ingesteld.'));
        return;
      }

      state.sources.forEach(source => {
        const card = document.createElement('article');
        card.className = 'source-card source-' + safeStatus(source.status);

        const heading = document.createElement('div');
        heading.className = 'source-card-heading';
        const name = document.createElement('h3');
        name.textContent = source.name || 'Naamloze bron';
        const badge = document.createElement('span');
        badge.className = 'source-badge';
        badge.textContent = sourceStatusLabels[source.status] || 'Onbekend';
        heading.append(name, badge);

        const count = document.createElement('p');
        count.className = 'source-count';
        count.textContent = numberFormat.format(Number(source.recordCount) || 0) + ' workshopregels';
        card.append(heading, count);

        if (source.message) {
          const message = document.createElement('p');
          message.className = 'source-message';
          message.textContent = source.message;
          card.appendChild(message);
        }

        if (source.errorCode) {
          const errorMeta = document.createElement('p');
          errorMeta.className = 'source-error-meta';
          errorMeta.textContent = 'Foutcode: ' + source.errorCode +
            (source.errorReference ? ' · Referentie: ' + source.errorReference : '');
          card.appendChild(errorMeta);
        }

        const warnings = Object.entries(source.warnings || {}).filter(entry => Number(entry[1]) > 0);
        if (warnings.length) {
          const list = document.createElement('ul');
          list.className = 'source-warnings';
          warnings.forEach(entry => {
            const item = document.createElement('li');
            item.textContent = (warningLabels[entry[0]] || 'Controlepunt') + ': ' + numberFormat.format(entry[1]);
            list.appendChild(item);
          });
          card.appendChild(list);
        }

        elements.sourceCards.appendChild(card);
      });
    }

    function safeStatus(status) {
      return ['demo', 'ok', 'warning', 'error', 'not-configured'].includes(status) ? status : 'error';
    }

    function setLoading(loading) {
      elements.refresh.disabled = loading;
      elements.refresh.textContent = loading ? 'Laden…' : 'Vernieuwen';
      elements.dashboard.setAttribute('aria-busy', loading ? 'true' : 'false');
    }

    function beginLoadingFeedback() {
      stopLoadingFeedback();
      state.loadStartedAt = Date.now();
      setLoading(true);
      elements.mode.textContent = 'Laden…';
      elements.updated.textContent = 'Brongegevens worden opgehaald';
      elements.message.hidden = false;
      elements.message.classList.remove('error', 'warning');
      elements.message.classList.add('loading');
      elements.message.textContent = 'Dashboardgegevens worden geladen…';

      [
        [1500, 'De Google Sheets worden gecontroleerd…'],
        [5000, 'De workshopregels van beide bronnen worden samengevoegd…'],
        [10000, 'Het laden duurt langer dan normaal. Grote Sheets en veel formules kunnen extra tijd kosten.']
      ].forEach(step => {
        state.loadingTimers.push(setTimeout(() => {
          elements.message.textContent = step[1];
        }, step[0]));
      });
    }

    function stopLoadingFeedback() {
      state.loadingTimers.forEach(timer => clearTimeout(timer));
      state.loadingTimers = [];
      const duration = state.loadStartedAt ? Date.now() - state.loadStartedAt : 0;
      state.loadStartedAt = 0;
      elements.message.classList.remove('loading');
      setLoading(false);
      return duration;
    }

    function formatLoadDuration(milliseconds) {
      return new Intl.NumberFormat('nl-NL', {
        minimumFractionDigits: 1,
        maximumFractionDigits: 1
      }).format(milliseconds / 1000) + ' s';
    }

    function valuesOf(field) {
      const values = [...new Set(state.records.map(record => record[field]).filter(Boolean))];
      return values.sort((a, b) => field === 'schoolYear'
        ? String(b).localeCompare(String(a), 'nl')
        : String(a).localeCompare(String(b), 'nl'));
    }

    function fillFilter(select, values) {
      const current = select.value;
      while (select.options.length > 1) select.remove(1);

      values.forEach(value => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
      });

      select.value = values.includes(current) ? current : '';
    }

    function configureDateRange(preserveSelection) {
      if (!['scheduledDate', 'requestedDate'].includes(elements.dateBasis.value)) {
        elements.dateBasis.value = 'scheduledDate';
      }

      const previousFrom = state.dateMonths[Number(elements.dateFrom.value)] || '';
      const previousTo = state.dateMonths[Number(elements.dateTo.value)] || '';
      const validMonths = state.records
        .reduce((dates, record) => dates.concat(recordDateValues(record)), [])
        .map(monthValue)
        .filter(Boolean)
        .sort();
      state.dateMonths = validMonths.length
        ? monthsBetween(validMonths[0], validMonths[validMonths.length - 1])
        : [];

      const lastIndex = Math.max(0, state.dateMonths.length - 1);
      elements.dateFrom.min = 0;
      elements.dateFrom.max = lastIndex;
      elements.dateTo.min = 0;
      elements.dateTo.max = lastIndex;
      elements.dateFrom.value = preserveSelection && state.dateMonths.includes(previousFrom)
        ? state.dateMonths.indexOf(previousFrom)
        : 0;
      elements.dateTo.value = preserveSelection && state.dateMonths.includes(previousTo)
        ? state.dateMonths.indexOf(previousTo)
        : lastIndex;
      elements.dateFrom.disabled = state.dateMonths.length < 2;
      elements.dateTo.disabled = state.dateMonths.length < 2;
      updateDateRangeLabels();
    }

    function configureStudentRange(preserveSelection) {
      const previousBounds = state.studentBounds;
      const previousFrom = Number(elements.studentsFrom.value);
      const previousTo = Number(elements.studentsTo.value);
      const values = state.records
        .map(record => record.students)
        .filter(value => Number.isInteger(value) && value >= 0)
        .sort((a, b) => a - b);

      state.studentBounds = values.length ? { minimum: values[0], maximum: values[values.length - 1] } : null;
      const minimum = state.studentBounds ? state.studentBounds.minimum : 0;
      const maximum = state.studentBounds ? state.studentBounds.maximum : 0;
      elements.studentsFrom.min = minimum;
      elements.studentsFrom.max = maximum;
      elements.studentsTo.min = minimum;
      elements.studentsTo.max = maximum;
      elements.studentsFrom.value = preserveSelection && previousBounds
        ? clamp(previousFrom, minimum, maximum)
        : minimum;
      elements.studentsTo.value = preserveSelection && previousBounds
        ? clamp(previousTo, minimum, maximum)
        : maximum;
      elements.studentsFrom.disabled = !state.studentBounds || minimum === maximum;
      elements.studentsTo.disabled = !state.studentBounds || minimum === maximum;
      updateStudentRangeLabels();
    }

    function monthsBetween(first, last) {
      const months = [];
      let year = Number(first.slice(0, 4));
      let month = Number(first.slice(5, 7));
      const finalYear = Number(last.slice(0, 4));
      const finalMonth = Number(last.slice(5, 7));

      while (year < finalYear || (year === finalYear && month <= finalMonth)) {
        months.push(year + '-' + String(month).padStart(2, '0'));
        month += 1;
        if (month === 13) {
          month = 1;
          year += 1;
        }
      }
      return months;
    }

    function monthValue(value) {
      return /^\d{4}-\d{2}-\d{2}$/.test(String(value || '')) ? String(value).slice(0, 7) : '';
    }

    function recordDateValues(record) {
      if (elements.dateBasis.value === 'requestedDate') {
        return monthValue(record.requestedDate) ? [record.requestedDate] : [];
      }
      const dates = Array.isArray(record.scheduledDates)
        ? record.scheduledDates
        : record.scheduledDate ? [record.scheduledDate] : [];
      return [...new Set(dates.filter(date => monthValue(date)))].sort();
    }

    function clamp(value, minimum, maximum) {
      return Math.min(maximum, Math.max(minimum, Number(value)));
    }

    function updateDateRangeLabels() {
      const from = state.dateMonths[Number(elements.dateFrom.value)];
      const to = state.dateMonths[Number(elements.dateTo.value)];
      const fromLabel = from ? formatMonth(from) : 'Geen geldige datums';
      const toLabel = to ? formatMonth(to) : 'Geen geldige datums';
      elements.dateFromValue.textContent = fromLabel;
      elements.dateToValue.textContent = toLabel;
      elements.dateFrom.setAttribute('aria-valuetext', fromLabel);
      elements.dateTo.setAttribute('aria-valuetext', toLabel);
    }

    function updateStudentRangeLabels() {
      if (!state.studentBounds) {
        elements.studentsFromValue.textContent = 'Geen bekende aantallen';
        elements.studentsToValue.textContent = 'Geen bekende aantallen';
        elements.studentsFrom.setAttribute('aria-valuetext', 'Geen bekende aantallen');
        elements.studentsTo.setAttribute('aria-valuetext', 'Geen bekende aantallen');
        return;
      }
      const fromLabel = studentLabel(Number(elements.studentsFrom.value));
      const toLabel = studentLabel(Number(elements.studentsTo.value));
      elements.studentsFromValue.textContent = fromLabel;
      elements.studentsToValue.textContent = toLabel;
      elements.studentsFrom.setAttribute('aria-valuetext', fromLabel);
      elements.studentsTo.setAttribute('aria-valuetext', toLabel);
    }

    function formatMonth(month) {
      const date = new Date(month + '-01T12:00:00');
      return new Intl.DateTimeFormat('nl-NL', { month: 'long', year: 'numeric' }).format(date);
    }

    function formatMonthShort(month) {
      const date = new Date(month + '-01T12:00:00');
      return new Intl.DateTimeFormat('nl-NL', { month: 'short', year: '2-digit' }).format(date);
    }

    function studentLabel(value) {
      return numberFormat.format(value) + (value === 1 ? ' leerling' : ' leerlingen');
    }

    function constrainRange(from, to, changed, updateLabels) {
      if (Number(from.value) > Number(to.value)) {
        if (changed === from) to.value = from.value;
        else from.value = to.value;
      }
      updateLabels();
      render();
    }

    function filteredRecords() {
      const selections = filters.reduce((active, filter) => {
        if (filter.element.value) active[filter.field] = filter.element.value;
        return active;
      }, {});
      return state.records.filter(record =>
        recordMatchesFilters(record, selections) && recordMatchesRanges(record)
      );
    }

    function recordMatchesFilters(record, selections) {
      return Object.keys(selections).every(field => record[field] === selections[field]);
    }

    function recordMatchesRanges(record) {
      const months = recordDateValues(record).map(monthValue);
      const dateMatches = months.length
        ? months.some(month =>
          month >= state.dateMonths[Number(elements.dateFrom.value)] &&
          month <= state.dateMonths[Number(elements.dateTo.value)]
        )
        : elements.includeUnknownDate.checked;

      const studentsKnown = Number.isInteger(record.students) && record.students >= 0;
      const studentsMatch = studentsKnown
        ? state.studentBounds && record.students >= Number(elements.studentsFrom.value) &&
          record.students <= Number(elements.studentsTo.value)
        : elements.includeUnknownStudents.checked;
      return Boolean(dateMatches && studentsMatch);
    }

    function render() {
      const records = filteredRecords();
      elements.recentDateHeading.textContent = elements.dateBasis.value === 'requestedDate'
        ? 'Datum aanvraag'
        : 'Definitieve datum';
      elements.resultCount.textContent = numberFormat.format(records.length) + ' van ' +
        numberFormat.format(state.records.length) + ' workshops zichtbaar';

      renderKpis(records);
      renderComparison(records);
      if (state.canViewFinancials) renderFinancial(records);
      else clearFinancial();
      renderCharts(records);
      renderRecent(records);
    }

    function renderKpis(records) {
      const totals = dashboardMetrics(records);
      const metrics = [
        ['Aanvragen / workshops', formatInteger(totals.requests)],
        ['Leerlingdeelnames', formatInteger(totals.studentParticipations)],
        ['Scholen', formatInteger(totals.schools)],
        ['Lesmomenten', formatInteger(totals.sessions)],
        ['Uitgevoerd', formatInteger(totals.completed)],
        ['Gem. leerlingen / aanvraag', formatDecimal(totals.averageStudents)],
        ['Aanvragen / school', formatDecimal(totals.requestsPerSchool)]
      ];

      elements.kpis.replaceChildren(...metrics.map(metric => {
        const card = document.createElement('article');
        card.className = 'kpi';
        const label = document.createElement('p');
        label.className = 'kpi-label';
        label.textContent = metric[0];
        const value = document.createElement('p');
        value.className = 'kpi-value';
        value.textContent = metric[1];
        card.append(label, value);
        return card;
      }));

      if (!totals.requests) {
        elements.kpiQualityNote.textContent = 'Geen aanvragen binnen de huidige filters.';
      } else if (totals.unknownStudentCounts) {
        elements.kpiQualityNote.textContent = numberFormat.format(totals.unknownStudentCounts) +
          (totals.unknownStudentCounts === 1
            ? ' aanvraag heeft geen bekend leerlingaantal. Gemiddelden gebruiken alleen bekende aantallen.'
            : ' aanvragen hebben geen bekend leerlingaantal. Gemiddelden gebruiken alleen bekende aantallen.');
      } else {
        elements.kpiQualityNote.textContent = 'Alle zichtbare aanvragen hebben een bekend leerlingaantal.';
      }
    }

    function dashboardMetrics(records) {
      const knownStudents = records.filter(record => Number.isInteger(record.students) && record.students >= 0);
      const recordsWithSchool = records.filter(record => schoolIdentity(record));
      const schools = new Set(recordsWithSchool.map(schoolIdentity));
      const studentParticipations = sum(knownStudents, 'students');

      return {
        requests: records.length,
        studentParticipations: studentParticipations,
        schools: schools.size,
        sessions: sum(records, 'sessions'),
        completed: records.filter(record => record.statusGroup === 'Uitgevoerd').length,
        averageStudents: knownStudents.length ? studentParticipations / knownStudents.length : null,
        requestsPerSchool: schools.size ? recordsWithSchool.length / schools.size : null,
        unknownStudentCounts: records.length - knownStudents.length
      };
    }

    function schoolIdentity(record) {
      const school = normalizedIdentity(record.school);
      if (!school || school === 'onbekende school') return '';
      return [record.source, record.region, record.school].map(normalizedIdentity).join('|');
    }

    function normalizedIdentity(value) {
      return String(value || '')
        .normalize('NFKD')
        .replace(/[\u0300-\u036f]/g, '')
        .trim()
        .replace(/\s+/g, ' ')
        .toLocaleLowerCase('nl-NL');
    }

    function comparisonSources() {
      const names = state.sources.map(source => source.name)
        .concat(state.records.map(record => record.source))
        .filter(Boolean);
      return [...new Set(names)].sort((a, b) => String(a).localeCompare(String(b), 'nl'));
    }

    function renderComparison(records) {
      const sources = comparisonSources();
      elements.comparisonRows.replaceChildren();
      elements.comparisonSummary.textContent = numberFormat.format(records.length) +
        (records.length === 1 ? ' zichtbare aanvraag' : ' zichtbare aanvragen');

      if (!sources.length) {
        const row = document.createElement('tr');
        const cell = document.createElement('td');
        cell.colSpan = 9;
        cell.className = 'empty';
        cell.textContent = 'Geen stichtingen beschikbaar binnen deze gegevens.';
        row.appendChild(cell);
        elements.comparisonRows.appendChild(row);
        return;
      }

      sources.forEach(source => {
        const totals = dashboardMetrics(records.filter(record => record.source === source));
        const row = document.createElement('tr');
        const name = document.createElement('th');
        name.setAttribute('scope', 'row');
        name.textContent = source;
        row.appendChild(name);

        [
          formatInteger(totals.requests),
          formatInteger(totals.studentParticipations),
          formatInteger(totals.schools),
          formatInteger(totals.sessions),
          formatInteger(totals.completed),
          formatDecimal(totals.averageStudents),
          formatDecimal(totals.requestsPerSchool),
          formatInteger(totals.unknownStudentCounts)
        ].forEach(value => {
          const cell = document.createElement('td');
          cell.textContent = value;
          row.appendChild(cell);
        });
        elements.comparisonRows.appendChild(row);
      });
    }

    function renderFinancial(records) {
      const totals = financialMetrics(records);
      const metrics = [
        ['Totale kosten aanbieder', formatCurrency(totals.totalProviderCosts)],
        ['Te factureren', formatCurrency(totals.totalInvoiceAmount)],
        ['Marge complete regels', formatCurrency(totals.marginAmount)],
        ['Gewogen marge', formatPercentage(totals.weightedMarginRate)]
      ];

      elements.financialKpis.replaceChildren(...metrics.map(metric => {
        const card = document.createElement('article');
        card.className = 'financial-kpi';
        const label = document.createElement('p');
        label.className = 'financial-kpi-label';
        label.textContent = metric[0];
        const value = document.createElement('p');
        value.className = 'financial-kpi-value';
        value.textContent = metric[1];
        card.append(label, value);
        return card;
      }));

      elements.financialCompleteness.replaceChildren(
        financialQualityCard('Complete financiële regels', totals.completeCount, false),
        financialQualityCard('Onvolledige financiële regels', totals.incompleteCount, true)
      );

      if (!records.length) {
        elements.financialNote.textContent = 'Geen aanvragen binnen de huidige filters.';
      } else if (!totals.completeCount) {
        elements.financialNote.textContent = 'Geen enkele zichtbare regel bevat zowel kosten als een te factureren bedrag. Marge blijft daarom onbekend.';
      } else if (totals.incompleteCount) {
        elements.financialNote.textContent = numberFormat.format(totals.incompleteCount) +
          (totals.incompleteCount === 1
            ? ' regel is financieel onvolledig. Kosten en facturatie tellen bekende bedragen afzonderlijk; marge gebruikt alleen complete regels.'
            : ' regels zijn financieel onvolledig. Kosten en facturatie tellen bekende bedragen afzonderlijk; marge gebruikt alleen complete regels.');
      } else {
        elements.financialNote.textContent = 'Alle zichtbare regels bevatten zowel kosten als een te factureren bedrag.';
      }
    }

    function clearFinancial() {
      elements.financialKpis.replaceChildren();
      elements.financialCompleteness.replaceChildren();
      elements.financialNote.textContent = '';
    }

    function financialQualityCard(labelText, valueText, incomplete) {
      const card = document.createElement('div');
      card.className = 'financial-quality' + (incomplete ? ' incomplete' : '');
      const label = document.createElement('span');
      label.className = 'financial-quality-label';
      label.textContent = labelText;
      const value = document.createElement('strong');
      value.className = 'financial-quality-value';
      value.textContent = numberFormat.format(valueText);
      card.append(label, value);
      return card;
    }

    function financialMetrics(records) {
      const knownCosts = records.filter(record => isFinancialNumber(record.providerTotalCosts));
      const knownInvoices = records.filter(record => isFinancialNumber(record.invoiceAmount));
      const complete = records.filter(record =>
        isFinancialNumber(record.providerTotalCosts) && isFinancialNumber(record.invoiceAmount)
      );
      const completeCosts = complete.reduce((total, record) => total + record.providerTotalCosts, 0);
      const completeInvoices = complete.reduce((total, record) => total + record.invoiceAmount, 0);
      const marginAmount = complete.length ? completeInvoices - completeCosts : null;

      return {
        totalProviderCosts: knownCosts.length
          ? knownCosts.reduce((total, record) => total + record.providerTotalCosts, 0)
          : null,
        totalInvoiceAmount: knownInvoices.length
          ? knownInvoices.reduce((total, record) => total + record.invoiceAmount, 0)
          : null,
        marginAmount: marginAmount,
        weightedMarginRate: complete.length && completeInvoices !== 0
          ? marginAmount / completeInvoices
          : null,
        completeCount: complete.length,
        incompleteCount: records.length - complete.length
      };
    }

    function isFinancialNumber(value) {
      return typeof value === 'number' && Number.isFinite(value);
    }

    function renderCharts(records) {
      renderTimeline(records);
      renderCategoryChart(
        elements.sectorChart, elements.sectorTableRows, countBy(records, 'sector'), 8
      );
      renderCategoryChart(
        elements.regionChart, elements.regionTableRows, countBy(records, 'region'), 8
      );
      renderCategoryChart(
        elements.statusChart, elements.statusTableRows, countBy(records, 'statusGroup'), 8
      );
      renderCategoryChart(
        elements.workshopChart, elements.workshopTableRows, countBy(records, 'workshop'), 6
      );
      renderCategoryChart(
        elements.providerChart, elements.providerTableRows, countBy(records, 'provider'), 8
      );
      renderCategoryChart(
        elements.poChart, elements.poTableRows, weightedGrades(records, 'PO'), 9
      );
      renderCategoryChart(
        elements.voChart, elements.voTableRows, weightedGrades(records, 'VO'), 7
      );
    }

    function renderCategoryChart(chart, tableRows, entries, limit) {
      renderBars(chart, entries, limit);
      tableRows.replaceChildren();

      if (!entries.length) {
        const row = document.createElement('tr');
        const cell = document.createElement('td');
        cell.colSpan = 2;
        cell.className = 'empty';
        cell.textContent = 'Geen gegevens binnen deze filters.';
        row.appendChild(cell);
        tableRows.appendChild(row);
        return;
      }

      entries.forEach(entry => {
        const row = document.createElement('tr');
        const label = document.createElement('th');
        label.setAttribute('scope', 'row');
        label.textContent = entry[0];
        const value = document.createElement('td');
        value.textContent = formatChartNumber(entry[1]);
        row.append(label, value);
        tableRows.appendChild(row);
      });
    }

    function renderTimeline(records) {
      const metricKey = timelineMetrics[elements.timelineMetric.value]
        ? elements.timelineMetric.value
        : 'requests';
      const metric = timelineMetrics[metricKey];
      const sources = [...new Set(records.map(record => record.source).filter(Boolean))]
        .sort((a, b) => String(a).localeCompare(String(b), 'nl'));
      const fromIndex = Number(elements.dateFrom.value);
      const toIndex = Number(elements.dateTo.value);
      const months = state.dateMonths.slice(fromIndex, toIndex + 1);
      const values = new Map(months.map(month => [
        month,
        new Map(sources.map(source => [source, 0]))
      ]));
      let withoutDate = 0;
      let withoutMetric = 0;

      records.forEach(record => {
        const weights = timelineMonthWeights(record, months);
        if (!weights.length) {
          withoutDate += 1;
          return;
        }

        const value = timelineMetricValue(record, metricKey);
        if (value === null) {
          withoutMetric += 1;
          return;
        }

        weights.forEach(weight => {
          const monthValues = values.get(weight[0]);
          if (!monthValues || !monthValues.has(record.source)) return;
          monthValues.set(record.source, monthValues.get(record.source) + value * weight[1]);
        });
      });

      const totals = months.map(month => sources.reduce(
        (total, source) => total + values.get(month).get(source), 0
      ));
      const maximum = Math.max(0, ...totals);
      renderTimelineLegend(sources);
      renderTimelineTable(months, sources, values, metric.label);
      renderTimelineSubtitle(metricKey, withoutDate, withoutMetric);
      elements.timelineChart.replaceChildren();

      if (!months.length || !sources.length || maximum === 0) {
        elements.timelineChart.appendChild(emptyMessage('Geen gedateerde gegevens voor deze metriek binnen de filters.'));
        return;
      }

      const columns = document.createElement('div');
      columns.className = 'timeline-columns';
      columns.style.minWidth = Math.max(36, months.length * 4.2) + 'rem';

      months.forEach((month, monthIndex) => {
        const total = totals[monthIndex];
        const column = document.createElement('div');
        column.className = 'timeline-column';
        column.setAttribute('role', 'img');
        column.setAttribute('aria-label', formatMonth(month) + ': ' + sources.map(source =>
          source + ' ' + formatChartNumber(values.get(month).get(source))
        ).join(', '));

        const totalLabel = document.createElement('span');
        totalLabel.className = 'timeline-total';
        totalLabel.textContent = formatChartNumber(total);

        const track = document.createElement('div');
        track.className = 'timeline-track';
        track.style.height = Math.max(2, (total / maximum) * 100) + '%';
        track.setAttribute('aria-hidden', 'true');
        sources.forEach((source, sourceIndex) => {
          const sourceValue = values.get(month).get(source);
          const segment = document.createElement('span');
          segment.className = 'timeline-segment';
          segment.style.height = (total ? (sourceValue / total) * 100 : 0) + '%';
          segment.style.backgroundColor = timelinePalette[sourceIndex % timelinePalette.length];
          track.appendChild(segment);
        });

        const monthLabel = document.createElement('span');
        monthLabel.className = 'timeline-label';
        monthLabel.textContent = formatMonthShort(month);
        column.append(totalLabel, track, monthLabel);
        columns.appendChild(column);
      });

      elements.timelineChart.appendChild(columns);
    }

    function timelineMonthWeights(record, visibleMonths) {
      const visible = new Set(visibleMonths);
      if (elements.dateBasis.value === 'requestedDate') {
        const requestedMonth = monthValue(record.requestedDate);
        return visible.has(requestedMonth) ? [[requestedMonth, 1]] : [];
      }

      const dates = Array.isArray(record.scheduledDates)
        ? record.scheduledDates
        : record.scheduledDate ? [record.scheduledDate] : [];
      const counts = new Map();
      dates.forEach(date => {
        const month = monthValue(date);
        if (visible.has(month)) counts.set(month, (counts.get(month) || 0) + 1);
      });
      const total = [...counts.values()].reduce((sum, count) => sum + count, 0);
      return total ? [...counts.entries()].map(entry => [entry[0], entry[1] / total]) : [];
    }

    function timelineMetricValue(record, metric) {
      if (metric === 'requests') return 1;
      const value = record[metric];
      return Number.isInteger(value) && value >= 0 ? value : null;
    }

    function renderTimelineLegend(sources) {
      elements.timelineLegend.replaceChildren();
      sources.forEach((source, index) => {
        const item = document.createElement('span');
        item.className = 'legend-item';
        const swatch = document.createElement('span');
        swatch.className = 'legend-swatch';
        swatch.style.backgroundColor = timelinePalette[index % timelinePalette.length];
        swatch.setAttribute('aria-hidden', 'true');
        const label = document.createElement('span');
        label.textContent = source;
        item.append(swatch, label);
        elements.timelineLegend.appendChild(item);
      });
    }

    function renderTimelineTable(months, sources, values, metricLabel) {
      elements.timelineCaption.textContent = metricLabel + ' per maand en stichting';
      elements.timelineTableHead.replaceChildren();
      elements.timelineTableRows.replaceChildren();

      ['Maand'].concat(sources, ['Totaal']).forEach(labelText => {
        const heading = document.createElement('th');
        heading.setAttribute('scope', 'col');
        heading.textContent = labelText;
        elements.timelineTableHead.appendChild(heading);
      });

      if (!months.length || !sources.length) {
        const row = document.createElement('tr');
        const cell = document.createElement('td');
        cell.colSpan = sources.length + 2;
        cell.className = 'empty';
        cell.textContent = 'Geen gedateerde gegevens binnen deze filters.';
        row.appendChild(cell);
        elements.timelineTableRows.appendChild(row);
        return;
      }

      months.forEach(month => {
        const row = document.createElement('tr');
        const monthHeading = document.createElement('th');
        monthHeading.setAttribute('scope', 'row');
        monthHeading.textContent = formatMonth(month);
        row.appendChild(monthHeading);
        let total = 0;
        sources.forEach(source => {
          const value = values.get(month).get(source);
          total += value;
          const cell = document.createElement('td');
          cell.textContent = formatChartNumber(value);
          row.appendChild(cell);
        });
        const totalCell = document.createElement('td');
        totalCell.textContent = formatChartNumber(total);
        row.appendChild(totalCell);
        elements.timelineTableRows.appendChild(row);
      });
    }

    function renderTimelineSubtitle(metric, withoutDate, withoutMetric) {
      const parts = [elements.dateBasis.value === 'requestedDate' ? 'Datum aanvraag' : 'Definitieve lesdatums'];
      if (elements.dateBasis.value === 'scheduledDate') {
        parts.push('meerdere lesdagen worden evenredig over de zichtbare lesmaanden verdeeld');
      }
      if (withoutDate) {
        parts.push(formatInteger(withoutDate) + (withoutDate === 1
          ? ' aanvraag zonder geldige datum staat niet in de grafiek'
          : ' aanvragen zonder geldige datum staan niet in de grafiek'));
      }
      if (metric !== 'requests' && withoutMetric) {
        parts.push(formatInteger(withoutMetric) + (withoutMetric === 1
          ? ' aanvraag zonder geldig aantal staat niet in de grafiek'
          : ' aanvragen zonder geldig aantal staan niet in de grafiek'));
      }
      elements.timelineSubtitle.textContent = parts.join(' · ');
    }

    function weightedGrades(records, sector) {
      const maximum = sector === 'PO' ? 8 : 6;
      const values = new Map();
      let unknown = 0;

      records.filter(record => record.sector === sector).forEach(record => {
        const grades = [...new Set((Array.isArray(record.grades) ? record.grades : [])
          .filter(grade => Number.isInteger(grade) && grade >= 1 && grade <= maximum))];
        if (!grades.length) {
          unknown += 1;
          return;
        }
        const share = 1 / grades.length;
        grades.forEach(grade => values.set(grade, (values.get(grade) || 0) + share));
      });

      const entries = [...values.entries()]
        .sort((a, b) => a[0] - b[0])
        .map(entry => [(sector === 'PO' ? 'Groep ' : 'Leerjaar ') + entry[0], entry[1]]);
      if (unknown) entries.push(['Onbekend', unknown]);
      return entries;
    }

    function formatInteger(value) {
      return numberFormat.format(value);
    }

    function formatDecimal(value) {
      return value === null ? '—' : decimalFormat.format(value);
    }

    function formatCurrency(value) {
      return value === null ? '—' : currencyFormat.format(Math.abs(value) < 0.0000001 ? 0 : value);
    }

    function formatPercentage(value) {
      return value === null ? '—' : percentFormat.format(Math.abs(value) < 0.0000001 ? 0 : value);
    }

    function formatChartNumber(value) {
      return chartNumberFormat.format(Math.abs(value) < 0.0000001 ? 0 : value);
    }

    function countBy(records, field) {
      const counts = new Map();
      records.forEach(record => counts.set(record[field] || 'Onbekend', (counts.get(record[field] || 'Onbekend') || 0) + 1));
      return [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'nl'));
    }

    function renderBars(container, entries, limit) {
      container.replaceChildren();
      const visible = entries.slice(0, limit);
      if (entries.length > limit) {
        visible.push([
          'Overige (' + (entries.length - limit) + ')',
          entries.slice(limit).reduce((total, entry) => total + entry[1], 0)
        ]);
      }

      if (!visible.length) {
        container.appendChild(emptyMessage('Geen gegevens binnen deze filters.'));
        return;
      }

      const maximum = Math.max(...visible.map(entry => entry[1]));
      visible.forEach(entry => {
        const row = document.createElement('div');
        row.className = 'bar-row';

        const label = document.createElement('div');
        label.className = 'bar-label';
        const name = document.createElement('span');
        name.textContent = entry[0];
        const value = document.createElement('strong');
        value.textContent = formatChartNumber(entry[1]);
        label.append(name, value);

        const track = document.createElement('div');
        track.className = 'bar-track';
        const fill = document.createElement('div');
        fill.className = 'bar-fill';
        fill.style.width = ((entry[1] / maximum) * 100) + '%';
        track.setAttribute('aria-hidden', 'true');
        track.appendChild(fill);

        row.append(label, track);
        container.appendChild(row);
      });
    }

    function renderRecent(records) {
      elements.recentRows.replaceChildren();
      const recent = [...records]
        .sort((a, b) => recentDateValue(b).localeCompare(recentDateValue(a)))
        .slice(0, 8);

      if (!recent.length) {
        const row = document.createElement('tr');
        const cell = document.createElement('td');
        cell.colSpan = 5;
        cell.className = 'empty';
        cell.textContent = 'Geen workshops binnen deze filters.';
        row.appendChild(cell);
        elements.recentRows.appendChild(row);
        return;
      }

      recent.forEach(record => {
        const row = document.createElement('tr');
        [formatRecordDates(record), record.source, record.workshop, record.status,
          record.students === null ? '—' : numberFormat.format(record.students)]
          .forEach(value => {
            const cell = document.createElement('td');
            cell.textContent = value;
            row.appendChild(cell);
          });
        elements.recentRows.appendChild(row);
      });
    }

    function recentDateValue(record) {
      const dates = recordDateValues(record);
      return dates.length ? dates[dates.length - 1] : '';
    }

    function formatRecordDates(record) {
      const dates = recordDateValues(record);
      return dates.length ? dates.map(formatDate).join(' · ') : 'Onbekend';
    }

    function sum(records, field) {
      return records.reduce((total, record) => total + (Number(record[field]) || 0), 0);
    }

    function formatDate(value) {
      if (!value) return 'Onbekend';
      const date = new Date(value + 'T12:00:00');
      return isNaN(date.getTime()) ? value : new Intl.DateTimeFormat('nl-NL').format(date);
    }

    function formatDateTime(value) {
      const date = new Date(value);
      return isNaN(date.getTime()) ? 'onbekend' : new Intl.DateTimeFormat('nl-NL', {
        dateStyle: 'short', timeStyle: 'short'
      }).format(date);
    }

    function emptyMessage(text) {
      const message = document.createElement('p');
      message.className = 'empty';
      message.textContent = text;
      return message;
    }

    filters.forEach(filter => filter.element.addEventListener('change', render));
    elements.dateBasis.addEventListener('change', () => {
      configureDateRange(false);
      render();
    });
    elements.dateFrom.addEventListener('input', () => {
      constrainRange(elements.dateFrom, elements.dateTo, elements.dateFrom, updateDateRangeLabels);
    });
    elements.dateTo.addEventListener('input', () => {
      constrainRange(elements.dateFrom, elements.dateTo, elements.dateTo, updateDateRangeLabels);
    });
    elements.studentsFrom.addEventListener('input', () => {
      constrainRange(elements.studentsFrom, elements.studentsTo, elements.studentsFrom, updateStudentRangeLabels);
    });
    elements.studentsTo.addEventListener('input', () => {
      constrainRange(elements.studentsFrom, elements.studentsTo, elements.studentsTo, updateStudentRangeLabels);
    });
    elements.includeUnknownDate.addEventListener('change', render);
    elements.includeUnknownStudents.addEventListener('change', render);
    elements.timelineMetric.addEventListener('change', render);
    elements.refresh.addEventListener('click', loadDashboard);
    elements.reset.addEventListener('click', () => {
      filters.forEach(filter => { filter.element.value = ''; });
      elements.dateBasis.value = 'scheduledDate';
      elements.timelineMetric.value = 'requests';
      elements.includeUnknownDate.checked = true;
      elements.includeUnknownStudents.checked = true;
      configureDateRange(false);
      configureStudentRange(false);
      render();
    });

    loadDashboard();
  })();
</script>
